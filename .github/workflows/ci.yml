name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Backend format check
        run: dotnet format --verify-no-changes EventTicketing.sln

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .tool-versions

      - name: Install frontend deps
        run: npm ci
        working-directory: event-ticketing-ui

      - name: Frontend lint
        run: npm run lint
        working-directory: event-ticketing-ui

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Backend unit tests
        run: dotnet test --project EventTicketing.Tests -- --filter-not-trait "Category=Integration"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .tool-versions

      - name: Install frontend deps
        run: npm ci
        working-directory: event-ticketing-ui

      - name: Frontend unit tests
        run: npm test
        working-directory: event-ticketing-ui

  integration-tests:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Backend integration tests
        run: dotnet test --project EventTicketing.Tests -- --filter-trait "Category=Integration"

  e2e-ui:
    name: E2E Tests (UI)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .tool-versions

      - name: Install frontend deps
        run: npm ci
        working-directory: event-ticketing-ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: event-ticketing-ui

      - name: UI E2E tests
        run: npm run test:e2e
        working-directory: event-ticketing-ui

  e2e-full:
    name: E2E Tests (full stack)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .tool-versions

      - name: Build .NET projects
        run: dotnet build EventTicketing.sln

      - name: Install Playwright browsers
        run: pwsh EventTicketing.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start .NET API
        run: nohup dotnet run --project EventTicketing.Api --no-build > api.log 2>&1 &

      - name: Install frontend deps
        run: npm ci
        working-directory: event-ticketing-ui

      - name: Start Vite dev server
        run: nohup npm run dev > vite.log 2>&1 &
        working-directory: event-ticketing-ui

      - name: Wait for API and UI
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:5017/health/ready; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'

      - name: Full-stack E2E tests
        run: dotnet test --project EventTicketing.E2ETests --no-build

      - name: Show API log
        if: failure()
        run: cat api.log
