name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Backend format check
        run: dotnet format --verify-no-changes EventTicketing.sln

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .tool-versions

      - name: Install frontend deps
        run: npm ci
        working-directory: event-ticketing-ui

      - name: Frontend lint
        run: npm run lint
        working-directory: event-ticketing-ui

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Backend unit tests
        run: dotnet test --project EventTicketing.Tests -- --filter-not-trait "Category=Integration"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .tool-versions

      - name: Install frontend deps
        run: npm ci
        working-directory: event-ticketing-ui

      - name: Frontend unit tests
        run: npm test
        working-directory: event-ticketing-ui

  integration-tests:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Backend integration tests
        run: dotnet test --project EventTicketing.Tests -- --filter-trait "Category=Integration"
